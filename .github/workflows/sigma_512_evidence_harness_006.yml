name: SIGMA 512 Evidence Harness 006

on:
  push:
    branches: [SIGMA_LIFE]
    paths:
      - 'EVIDENCE/SIGMA_512_EVIDENCE_HARNESS_006/**'
      - 'BRAIN/CANONICAL/CURRENT_STATE.json'
      - 'BRAIN/CANONICAL/LOCAL_COGNITION_REQUEST.json'
      - '.github/workflows/sigma_512_evidence_harness_006.yml'
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    env:
      SIGMA_LOCAL_EXECUTION_ID: SIGMA-512-EVIDENCE-HARNESS-006-SECTION-III-LEARNING-025-036
    steps:
      - uses: actions/checkout@v4
      - name: Run EH006 Section III continuous-learning measurement
        env:
          SIGMA_HARNESS_OUTPUT_DIR: ${{ runner.temp }}/sigma-eh006
        run: python EVIDENCE/SIGMA_512_EVIDENCE_HARNESS_006/v1.0.0/run_harness.py
      - name: Show EH006 result
        run: cat "${{ runner.temp }}/sigma-eh006/evidence_harness_006_result.json"
