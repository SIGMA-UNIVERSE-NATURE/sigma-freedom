name: SIGMA 512 Evidence Harness 002

on:
  push:
    paths:
      - "EVIDENCE/SIGMA_512_EVIDENCE_HARNESS_002/**"
      - "BẢN ĐỒ/SIGMA_512_ATTRIBUTES/**"
      - "54_CORES/**"
      - ".github/workflows/sigma_512_evidence_harness_002.yml"
  pull_request:
    paths:
      - "EVIDENCE/SIGMA_512_EVIDENCE_HARNESS_002/**"
      - "BẢN ĐỒ/SIGMA_512_ATTRIBUTES/**"
      - "54_CORES/**"
      - ".github/workflows/sigma_512_evidence_harness_002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-harness-002:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated evidence harness 002
        run: python "EVIDENCE/SIGMA_512_EVIDENCE_HARNESS_002/v1.0.0/run_harness.py"
      - name: Upload observed evidence
        uses: actions/upload-artifact@v4
        with:
          name: sigma-512-evidence-harness-002-result
          path: EVIDENCE/SIGMA_512_EVIDENCE_HARNESS_002/v1.0.0/out/evidence_harness_002_result.json
          if-no-files-found: error
