name: SIGMA 512 Evidence Harness 003

on:
  push:
    branches: [SIGMA_LIFE]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-harness-003:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated evidence harness 003
        run: python "EVIDENCE/SIGMA_512_EVIDENCE_HARNESS_003/v1.0.0/run_harness.py"
      - name: Upload observed evidence
        uses: actions/upload-artifact@v4
        with:
          name: sigma-512-evidence-harness-003-result
          path: EVIDENCE/SIGMA_512_EVIDENCE_HARNESS_003/v1.0.0/out/evidence_harness_003_result.json
          if-no-files-found: error
