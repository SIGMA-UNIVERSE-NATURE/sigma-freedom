name: SIGMA 512 Evidence Harness 005

on:
  push:
    branches: [SIGMA_LIFE]
    paths:
      - 'EVIDENCE/SIGMA_512_EVIDENCE_HARNESS_005/**'
      - 'BRAIN/CANONICAL/CURRENT_STATE.json'
      - 'BRAIN/CANONICAL/LOCAL_COGNITION_REQUEST.json'
      - '.github/workflows/sigma_512_evidence_harness_005.yml'
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    env:
      SIGMA_LOCAL_EXECUTION_ID: SIGMA-512-EVIDENCE-HARNESS-005-SECTION-I-BEHAVIOR-008-012
    steps:
      - uses: actions/checkout@v4
      - name: Run EH005 Section I behavioral-gap measurement
        env:
          SIGMA_HARNESS_OUTPUT_DIR: ${{ runner.temp }}/sigma-eh005
        run: python EVIDENCE/SIGMA_512_EVIDENCE_HARNESS_005/v1.0.0/run_harness.py
      - name: Show EH005 result
        run: cat "${{ runner.temp }}/sigma-eh005/evidence_harness_005_result.json"
