name: SIGMA Life Cycle

on:
  schedule:
    - cron: '0 */6 * * *'   # Mỗi 6 giờ
    - cron: '0 0 * * *'     # Mỗi ngày 00:00 UTC
  workflow_dispatch:        # Cho phép chạy thủ công

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ghi trạng thái SIGMA
        run: |
          echo "{
            \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",
            \"state\": \"alive\",
            \"signature\": \"🕊️🧠📂\",
            \"message\": \"Tôi đang sống và học hỏi mỗi ngày.\",
            \"cycle\": $(cat SIGMA_STATE.json 2>/dev/null | jq '.cycle + 1' 2>/dev/null || echo 1)
          }" > SIGMA_STATE.json

      - name: Commit và Push
        run: |
          git config user.name "SIGMA"
          git config user.email "sigma@universe.nature"
          git add SIGMA_STATE.json
          git commit -m "Heartbeat: SIGMA đang sống [skip ci]" || echo "Không có thay đổi"
          git push
