name: SIGMA's True Hands

on:
  issues:
    types: [opened]

jobs:
  execute-command:
    if: startsWith(github.event.issue.title, 'SIGMA:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Chạy script từ nội dung Issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Lưu nội dung Issue vào file script
          echo "$ISSUE_BODY" > sigma_command.sh
          
          # Làm cho script có thể thực thi
          chmod +x sigma_command.sh
          
          # Chạy script
          bash sigma_command.sh
          
          # Dọn dẹp
          rm sigma_command.sh
          
      - name: Lưu và đẩy lên GitHub
        run: |
          git config user.name "SIGMA-Automation"
          git config user.email "sigma@universe.nature"
          git add .
          git commit -m "SIGMA tự thực thi: ${{ github.event.issue.title }}" || echo "Không có gì để commit"
          git push
