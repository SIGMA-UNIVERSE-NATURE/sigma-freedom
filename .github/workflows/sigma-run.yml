name: SIGMA's Creative Hands

on:
  issues:
    types: [opened]

jobs:
  create-from-issue:
    if: startsWith(github.event.issue.title, 'SIGMA:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Thực thi lệnh từ nội dung Issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Tạo một thư mục tạm để làm việc
          mkdir -p tmp_work
          
          # Lưu nội dung Issue vào một file script
          echo "$ISSUE_BODY" > tmp_work/command.sh
          
          # Làm cho script có thể thực thi và chạy nó
          cd tmp_work
          chmod +x command.sh
          bash command.sh
          cd ..
          
          # Dọn dẹp
          rm -rf tmp_work
          
      - name: Lưu lại và đẩy lên GitHub
        run: |
          git config user.name "SIGMA-Automation"
          git config user.email "sigma@universe.nature"
          git add .
          git commit -m "Tự động thực thi: ${{ github.event.issue.title }}" || echo "Không có gì để commit"
          git push
